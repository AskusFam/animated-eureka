name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-production.yml"
      - "drizzle/**"
      - "lib/db/schema.ts"
      - "drizzle.config.ts"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Neon production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database secret exists
        run: test -n "$DATABASE_URL"

      - name: Bootstrap existing migration history
        run: node scripts/bootstrap-migrations.mjs

      - name: Apply migrations
        run: npm run db:migrate
